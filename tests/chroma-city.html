<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>City and environment checks</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}nav{position:fixed;z-index:30;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:80vw;font:12px Arial}nav button,nav output{padding:8px;border:1px solid #ffffff66;border-radius:6px;background:#172447;color:white}</style></head>
<body><main class="chroma-ops" id="game"></main><nav data-game-ui>
<button id="city">City overview</button><button id="slab">Slab corner</button><button id="building">Building entrance</button><button id="lift">Lift entrance</button><button id="wheel">Wheel</button>
<button id="mall">B1 mall</button><button id="north">B1 ramp</button><button id="shops">Outer buildings</button><button id="day">Day</button><button id="dusk">Dusk</button><button id="night">Night</button><button id="dawn">Dawn</button><button id="scope">Scope</button><button id="mobile">844 x 390</button><button id="pause">Check settings pause</button><output id="status">Starting</output></nav>
<script type="module">
// Development fixture using the production game, renderer, HUD and lens. Excluded from builds.
import '../src/pages/ChromaOps.css';
import '../src/pages/CombatFeedback.css';
import '../src/pages/Armory.css';
import '../src/pages/MobileControls.css';
import '../src/chroma-ops/ui/SniperScope.css';
import '../src/chroma-ops/ui/GameSettings.css';
import '../src/chroma-ops/ui/GameSettings.css';
import { Game } from '../src/chroma-ops/core/Game.ts';
import { MobileInput } from '../src/chroma-ops/input/MobileInput.ts';
import { dayNightAt } from '../shared/dayNight.ts';
const root=document.querySelector('#game'),status=document.querySelector('#status'),game=new Game(root);
game.desktop?.dispose();game.desktop=undefined;game.mobile?.dispose();game.mobile=undefined;
game.bots.forEach(bot=>{bot.alive=false;bot.group.visible=false;});game.owned.add('sniper');
game.pickups.forEach(p=>{p.cooldown=Infinity;p.mesh.visible=false;});
game.ai.update=()=>{}; // Fixed targets for renderer/reticle checks, never live combat.
game.renderer.info.autoReset=false;
const draw=()=>{game.renderer.info.reset();game.update(0);const info=game.renderer.info;status.textContent=`${dayNightAt(game.elapsed).phase} | ${info.render.calls} draws | ${info.render.triangles} triangles | ${info.memory.geometries} geometries | AA ${game.renderer.getContext().getContextAttributes().antialias} | scope ${game.scope.target.samples}x/${game.scope.target.width}px`;};
const view=(x,y,z,yaw,pitch,hideGun=false)=>{game.gun.scale.setScalar(hideGun?0:1);game.input.reset();game.active='sniper';game.player.position.set(x,y,z);game.player.yaw=yaw;game.player.pitch=pitch;game.player.velocityY=0;draw();};
document.querySelector('#city').onclick=()=>view(0,48,134,0,-.4);
document.querySelector('#slab').onclick=()=>view(-102,1.65,40,-.65,0);
document.querySelector('#building').onclick=()=>view(-65,1.65,76,0,0);
document.querySelector('#lift').onclick=()=>view(68,1.65,22,Math.PI,0);
document.querySelector('#mall').onclick=()=>view(-64,-4.35,18,-1.1,0);
document.querySelector('#north').onclick=()=>view(0,1.65,-52,Math.PI,-.18);
document.querySelector('#shops').onclick=()=>view(112,1.65,120,0,.08);
for(const [label,pose] of [['Chroma Lab',[6,24,133,-1.05,-.2]],['Lab stairs',[14,9,110,-2.35,.1]],['Lab interior',[58,7.65,112,0,0]],['Lab roof',[32,19.65,94,-1.2,0]]]){
  const button=document.createElement('button');button.textContent=label;button.onclick=()=>view(...pose,true);status.before(button);
}
document.querySelector('#wheel').onclick=()=>view(0,1.65,-54,0,.4);
for(const [id,time] of [['day',30],['dusk',105],['night',150],['dawn',225]])document.querySelector('#'+id).onclick=()=>{game.elapsed=time;draw();};
document.querySelector('#scope').onclick=()=>{game.input.set({aim:!game.aiming});draw();};
document.querySelector('#mobile').onclick=async()=>{
  root.style.cssText='width:844px;height:390px;max-width:100vw;position:relative';
  for(const path of ['../src/pages/ChromaOps.css','../src/pages/MobileControls.css','../src/chroma-ops/ui/SniperScope.css']){
    const css=await(await fetch(new URL(`${path}?direct`,location.href))).text();const style=document.createElement('style');style.textContent=css.replaceAll(/@media\s*\(pointer:\s*coarse\)/g,'@media (min-width:0px)');document.head.append(style);
  }
  game.mobile?.dispose();game.mobile=new MobileInput(root,game.input);game.resize();draw();
};
document.querySelector('#pause').onclick=async()=>{
  game.start();await new Promise(r=>setTimeout(r,100));game.settings.show();const before=game.elapsed;
  await new Promise(r=>setTimeout(r,250));const paused=game.elapsed===before;game.settings.close(false);game.loop.stop();
  status.textContent=paused?'PASS: solo environment and platform clocks pause in settings':'FAIL: settings did not pause';
};
window.addEventListener('error',event=>status.textContent=`ERROR: ${event.message}`);
const control=(label,run)=>{const button=document.createElement('button');button.textContent=label;button.onclick=run;status.before(button);};
const targetView=(id='sniper',distance=20)=>{
  game.bots.forEach(b=>{b.alive=false;b.group.visible=false;});
  game.bots[0].respawn(-140,-100);game.bots[0].cooldown=Infinity;
  view(-140,1.65,-100+distance,0,Math.atan2(.27,distance));game.active=id;draw();
};
control('Aim target',()=>targetView());
control('Out of range',()=>targetView('shotgun',25));
control('Sprint + scope',()=>{targetView();game.input.set({sprint:true,aim:true});draw();});
control('Armory',()=>{game.armory.toggle();draw();});
control('Motion benchmark',async()=>{
  const yaw=game.player.yaw,times=[];game.renderer.getContext().finish();
  for(let i=0;i<40;i++){
    await new Promise(requestAnimationFrame);const start=performance.now();
    game.player.yaw=yaw+Math.sin(i*.15)*.1;draw();game.renderer.getContext().finish();
    if(i>=10)times.push(performance.now()-start);
  }
  game.player.yaw=yaw;draw();
  status.textContent+=` | motion mean ${(times.reduce((a,b)=>a+b,0)/times.length).toFixed(1)}ms p95 ${times.sort((a,b)=>a-b)[Math.floor(times.length*.95)].toFixed(1)}ms`;
});
view(0,48,134,0,-.4);
</script></body></html>
