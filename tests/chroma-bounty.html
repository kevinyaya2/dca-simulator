<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>賞金模式介面驗證</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#10162c;color:white;font:14px Arial}nav{display:flex;gap:12px;padding:10px}button{padding:9px}#game{position:relative;width:1280px;height:720px;max-width:100vw}.chroma-ops{position:relative!important}output{padding:8px}</style>
</head><body><nav><button id="desktop">桌機 1280×720</button><button id="mobile">手機 844×390</button><button id="reward">重複擊殺事件</button><output id="status">準備中</output></nav><main id="game" class="chroma-ops co-multiplayer-shell"></main>
<script type="module">
import '../src/pages/ChromaOps.css';
import '../src/pages/MultiplayerArena.css';
import '../src/pages/CombatFeedback.css';
import '../src/pages/Armory.css';
import '../src/pages/MobileControls.css';
import '../src/chroma-ops/ui/BattleFeedback.css';
import '../src/chroma-ops/ui/SniperScope.css';
import { MultiplayerGame } from '../src/chroma-ops/core/MultiplayerGame.ts';
import { WEAPON_IDS, WEAPON_SPECS } from '../shared/weapons.ts';
class TestSocket{
  connected=true;handlers=new Map();
  on(name,fn){if(!this.handlers.has(name))this.handlers.set(name,new Set());this.handlers.get(name).add(fn);return this;}
  off(name,fn){this.handlers.get(name)?.delete(fn);return this;}
  emit(name,value){if(name==='net:ping')value(Date.now());}
  push(name,value){for(const fn of this.handlers.get(name)||[])fn(value);}
}
const root=document.querySelector('#game'),status=document.querySelector('#status'),socket=new TestSocket();
const game=new MultiplayerGame(root,socket,'BOUNTY',1,message=>{status.textContent=message;},'p0');
const players=Array.from({length:8},(_,i)=>({id:`p${i}`,name:i===1?'<b>安全暱稱</b>':`玩家 ${i+1}`,avatar:'',color:0x55aaff,x:i*12,y:1.65,z:-50,yaw:0,pitch:0,velocityY:0,jumpsUsed:0,hp:100,alive:true,kills:i===0?3:8-i,deaths:i,score:i<2?1100:1000-i*100,bounty:i<2?300:100,
  activeWeapon:'ar',ownedWeapons:['ar'],weapons:Object.fromEntries(WEAPON_IDS.map(id=>[id,{ammo:WEAPON_SPECS[id].magazine,reloadUntil:0}])),slowUntil:0,burnUntil:0,ack:0,supportId:null,aiming:false,sprinting:false}));
game.start();const snapshot={roundId:1,scoreTarget:1500,endsAt:Date.now()+254000,environmentTime:0,simulationTime:0,serverTime:Date.now(),tick:3,players,pickups:[]};socket.push('match:snapshot',snapshot);
const timer=setInterval(()=>socket.push('match:snapshot',{...snapshot,serverTime:Date.now()}),100);
// Stop camera capture so fixture controls remain clickable.
game.desktop?.dispose();game.desktop=undefined;
const reward={roundId:1,eventId:'bounty:visual:1',at:Date.now(),attackerId:'p0',attackerName:'玩家 1',victimId:'p1',victimName:'強敵',weapon:'ar',headshot:true,multi:1,streak:1,scoreAwarded:300,attackerBounty:300,victimBounty:275};
document.querySelector('#reward').onclick=()=>{
  socket.push('match:kill',reward);socket.push('match:kill',reward);
  const count=root.querySelectorAll('.co-kill-reward').length;
  status.textContent=count===1?'PASS：+300 分只顯示一次':'FAIL：得分重複';
};
document.querySelector('#desktop').onclick=()=>{root.style.width='1280px';root.style.height='720px';document.querySelector('#coarse')?.remove();window.dispatchEvent(new Event('resize'));status.textContent='桌機 1280×720';};
document.querySelector('#mobile').onclick=async()=>{
  if(!document.querySelector('#coarse')){
    const style=document.createElement('style');style.id='coarse';
    for(const path of ['../src/pages/ChromaOps.css','../src/pages/MobileControls.css','../src/pages/MultiplayerArena.css']){
      style.textContent+=(await(await fetch(new URL(`${path}?direct`,location.href))).text()).replaceAll(/@media\s*\(pointer:\s*coarse\)/g,'@media (min-width:0px)');
    }
    document.head.append(style);
  }
  root.style.width='844px';root.style.height='390px';window.dispatchEvent(new Event('resize'));status.textContent='手機 844×390';
};
requestAnimationFrame(()=>{status.textContent=root.querySelector('.co-mp-roster').textContent.includes('<b>安全暱稱</b>')&&!root.querySelector('.co-mp-roster span b')?'PASS：同分排名、暱稱安全顯示':'FAIL';});
window.addEventListener('pagehide',()=>{clearInterval(timer);game.dispose();});
</script></body></html>
